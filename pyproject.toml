[project]
name = "ottoman-llm"
version = "0.1.0"
description = "Osmanlıca dil modeli eğitim projesi"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "sentencepiece",
    "wikipedia-api",
    "requests",
    "beautifulsoup4",
    "tqdm",
    "wandb",
    "datasets",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.uv]
dev-dependencies = [
    "ipykernel",
    "jupyter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "tokenizer"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
